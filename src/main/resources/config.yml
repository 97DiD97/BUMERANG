# Текстуры встроены в сам плагин и сами отправляются игрокам при входе.
# true — бумеранги выглядят как кольца (наши текстуры).
# false — без текстур: медный слиток, железный слиток, алмаз.
resource-pack: true

# Как игроки получают текстуры:
# Если pack-url пустой, плагин сам раздаёт их по HTTP с порта pack-port
# (этот TCP-порт должен быть открыт на сервере).
# Если на хостинге открыть порт нельзя — загрузи BoomerangPack.zip (лежит внутри jar,
# его можно достать как zip) куда-нибудь в интернет и вставь прямую ссылку в pack-url.
pack-url: ""
pack-port: 8165

# Адрес сервера для ссылки на текстуры. Пусто — берётся тот адрес, к которому подключился игрок.
pack-host: ""

# true — игрок не сможет играть, если откажется от текстур
force-pack: false

# Страховка: через сколько тиков (20 = 1 сек) бумеранг принудительно возвращается
max-flight-ticks: 400

# Параметры видов бумеранга
#   damage — урон (2.0 = одно сердце)
#   max-bounces — сколько отскоков от блоков, потом возврат
#   no-hit-return-ticks — если столько тиков не было ударов о блоки, бумеранг сразу летит назад
#   throw-speed / return-speed — скорость в блоках за тик
tiers:
  copper:
    damage: 4.0
    max-bounces: 3
    no-hit-return-ticks: 30
    throw-speed: 0.9
    return-speed: 1.2
  iron:
    damage: 6.0
    max-bounces: 3
    no-hit-return-ticks: 30
    throw-speed: 1.0
    return-speed: 1.3
  diamond:
    damage: 8.0
    max-bounces: 3
    no-hit-return-ticks: 40
    throw-speed: 1.15
    return-speed: 1.5
